<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0a0a0c]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Móvil • Gimnasio FORMAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            michroma: ['Michroma', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Efectos de hardware y reflejos del dispositivo */
    .titanium-frame {
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.15),
        0 0 0 4px #1c1c1f,
        0 0 0 5px rgba(255, 255, 255, 0.08),
        0 25px 65px -12px rgba(0, 0, 0, 0.85),
        0 40px 100px -20px rgba(0, 0, 0, 0.7);
    }
    .specular-glare {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0.03) 100%);
      pointer-events: none;
    }
    /* Botones laterales del iPhone */
    .btn-action {
      position: absolute; left: -7px; top: 110px; width: 4px; height: 28px;
      background: #2a2a2e; border-radius: 2px 0 0 2px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .btn-vol-up {
      position: absolute; left: -7px; top: 155px; width: 4px; height: 48px;
      background: #2a2a2e; border-radius: 2px 0 0 2px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .btn-vol-down {
      position: absolute; left: -7px; top: 215px; width: 4px; height: 48px;
      background: #2a2a2e; border-radius: 2px 0 0 2px;
      box-shadow: -1px 0 2px rgba(0,0,0,0.5);
    }
    .btn-power {
      position: absolute; right: -7px; top: 170px; width: 4px; height: 75px;
      background: #2a2a2e; border-radius: 0 2px 2px 0;
      box-shadow: 1px 0 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="h-full text-white font-sans overflow-x-hidden select-none flex flex-col justify-between">

  <!-- BARRA DE CONTROL SUPERIOR DEL SIMULADOR -->
  <header class="w-full bg-[#111114]/90 backdrop-blur-md border-b border-white/10 px-4 sm:px-6 py-2.5 z-50 shrink-0">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 flex-wrap">
      
      <!-- Identidad y Título -->
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center font-michroma text-xs font-bold text-white shadow-inner">
          F+
        </div>
        <div>
          <h1 class="font-michroma text-xs sm:text-sm tracking-wider uppercase text-white font-bold flex items-center gap-2">
            Simulador de Smartphone
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          </h1>
          <p class="text-[10px] text-white/50">Gimnasio FORMAS • App Móvil Interactiva</p>
        </div>
      </div>

      <!-- Selector de Dispositivos y Controles -->
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
        <!-- Selector de Modelo -->
        <div class="flex items-center bg-white/5 border border-white/10 rounded-xl p-0.5 text-xs">
          <button onclick="setDevice('iphone-16', 393, 852, 'iPhone 16 Pro')" id="btn-dev-iphone-16" class="px-3 py-1.5 rounded-lg font-medium transition-all bg-white text-black font-semibold shadow">
            iPhone 16 Pro
          </button>
          <button onclick="setDevice('iphone-se', 375, 667, 'iPhone SE')" id="btn-dev-iphone-se" class="px-3 py-1.5 rounded-lg font-medium transition-all text-white/70 hover:text-white">
            iPhone SE
          </button>
          <button onclick="setDevice('pixel-9', 412, 915, 'Google Pixel 9')" id="btn-dev-pixel-9" class="px-3 py-1.5 rounded-lg font-medium transition-all text-white/70 hover:text-white">
            Pixel 9
          </button>
        </div>

        <!-- Selector Rápido de Rol (Instructor Alberto / Socio) -->
        <div class="flex items-center bg-white/5 border border-white/10 rounded-xl p-0.5 text-xs">
          <button onclick="setSimulatorRole('alberto')" id="btn-role-alberto" title="Iniciar sesión automáticamente como Instructor Alberto" class="px-3 py-1.5 rounded-lg font-medium transition-all bg-white/10 hover:bg-white hover:text-black text-white font-semibold flex items-center gap-1.5">
            <span>⚡ Modo Alberto</span>
          </button>
          <button onclick="setSimulatorRole('client')" id="btn-role-client" title="Cambiar a vista normal de Socio" class="px-3 py-1.5 rounded-lg font-medium transition-all text-white/70 hover:text-white">
            <span>👤 Modo Socio</span>
          </button>
          <button onclick="setSimulatorRole('reset')" id="btn-role-reset" title="Ver pantalla de login inicial" class="px-2.5 py-1.5 rounded-lg font-medium transition-all text-white/50 hover:text-white">
            <span>↺ Login</span>
          </button>
        </div>

        <!-- Zoom / Auto-fit -->
        <div class="hidden md:flex items-center bg-white/5 border border-white/10 rounded-xl p-1 text-xs gap-1">
          <button onclick="setScale('auto')" id="btn-scale-auto" title="Ajuste automático a la pantalla" class="px-2.5 py-1 rounded-lg transition-all bg-white/20 text-white font-medium">
            Auto
          </button>
          <button onclick="setScale(0.85)" id="btn-scale-85" class="px-2 py-1 rounded-lg transition-all text-white/60 hover:text-white">
            85%
          </button>
          <button onclick="setScale(1.0)" id="btn-scale-100" class="px-2 py-1 rounded-lg transition-all text-white/60 hover:text-white">
            100%
          </button>
        </div>

        <!-- Botón Recargar iframe -->
        <button onclick="reloadApp()" title="Recargar App dentro del teléfono" class="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-white/80 hover:text-white transition-all active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>

        <!-- Botón Pantalla Completa / Enlace directo -->
        <a href="index.html" target="_blank" title="Abrir App directamente en pestaña completa" class="px-3 py-1.5 bg-white/10 hover:bg-white hover:text-black border border-white/20 rounded-xl text-xs font-michroma transition-all active:scale-95 flex items-center gap-1.5">
          <span>Abrir Directo</span>
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
      </div>

    </div>
  </header>

  <!-- ESCENARIO PRINCIPAL DEL TELÉFONO -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 overflow-hidden relative" id="stage-container">
    
    <!-- Luces de Estudio y Gradiente Radial de Fondo -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.06)_0%,rgba(0,0,0,0.85)_75%)] pointer-events-none"></div>
    <div class="absolute w-[500px] h-[500px] bg-white/[0.02] rounded-full blur-3xl pointer-events-none"></div>

    <!-- ESCALADOR DINÁMICO DEL DISPOSITIVO -->
    <div id="device-scaler" class="transition-transform duration-300 origin-center relative">
      
      <!-- CONTENEDOR DEL TELÉFONO (CHASIS DE TITANIO) -->
      <div id="phone-chassis" class="relative bg-[#151518] rounded-[54px] p-[11px] titanium-frame transition-all duration-300" style="width: 415px; height: 874px;">
        
        <!-- Botones Físicos Laterales -->
        <div class="btn-action"></div>
        <div class="btn-vol-up"></div>
        <div class="btn-vol-down"></div>
        <div class="btn-power"></div>

        <!-- PANTALLA OLED INTERNA DEL SMARTPHONE -->
        <div id="phone-screen" class="relative w-full h-full bg-black rounded-[44px] overflow-hidden flex flex-col shadow-inner">
          
          <!-- BARRA DE ESTADO DE iOS (Reloj, Dynamic Island, Batería) -->
          <div class="relative z-30 w-full h-11 px-7 flex items-center justify-between text-white text-[12px] font-semibold tracking-tight select-none pointer-events-none">
            
            <!-- Hora Actual en Vivo -->
            <div id="status-clock" class="w-12 text-center font-medium">09:41</div>
            
            <!-- Dynamic Island Interactivo -->
            <div id="dynamic-island" class="w-[110px] h-[30px] bg-black rounded-full flex items-center justify-between px-2.5 shadow-md border border-white/5 transition-all duration-300">
              <!-- Cámara frontal con reflejo de lente -->
              <div class="w-3 h-3 rounded-full bg-[#0a0a14] border border-[#1a1a2e] flex items-center justify-center">
                <div class="w-1 h-1 rounded-full bg-[#1e2a4a]/80"></div>
              </div>
              <!-- Sensor FaceID -->
              <div class="w-2.5 h-2.5 rounded-full bg-[#0d0d12]"></div>
            </div>

            <!-- Iconos de Red, Wi-Fi y Batería -->
            <div class="w-12 flex items-center justify-end gap-1.5 text-white/90">
              <!-- Señal 5G -->
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.2.2-.2.51 0 .71.1.1.23.15.35.15.13 0 .26-.05.35-.15l1.83-1.83C8.44 19.34 10.14 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-1.38 0-2.63-.47-3.64-1.26l4.9-4.9V7h-2v3.15l-3.53 3.53C7.26 12.83 7 11.95 7 11c0-2.76 2.24-5 5-5s5 2.24 5 5-2.24 5-5 5z"/></svg>
              <!-- Batería 100% -->
              <div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
                <div class="w-full h-full bg-white rounded-2xs"></div>
              </div>
            </div>

          </div>

          <!-- IFRAME DE LA APP REAL (CON CARGA DINÁMICA INTERACTIVA) -->
          <div class="flex-1 w-full relative overflow-hidden bg-black">
            <iframe id="app-frame" src="index.html" class="w-full h-full border-0 absolute inset-0" title="Gimnasio FORMAS App"></iframe>
            <!-- Reflejo especular de cristal sobre la pantalla -->
            <div class="absolute inset-0 specular-glare pointer-events-none"></div>
          </div>

          <!-- INDICADOR DE INICIO (HOME BAR DE iOS) -->
          <div class="relative z-30 w-full h-5 flex items-center justify-center bg-transparent pointer-events-none">
            <div class="w-32 h-1 bg-white/40 rounded-full"></div>
          </div>

        </div>
      </div>
      
    </div>

  </main>

  <!-- PIE DE PÁGINA CON ESTADO Y CONEXIÓN REMOTA -->
  <footer class="w-full bg-[#111114]/90 backdrop-blur-md border-t border-white/10 px-4 py-2 z-40 text-center shrink-0">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs text-white/50 flex-wrap gap-2">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span class="text-white/80 font-medium">Servidor Local Activo:</span>
        <code class="text-white/90 bg-white/10 px-1.5 py-0.5 rounded font-mono text-[11px]">http://localhost:8085</code>
      </div>

      <div class="flex items-center gap-4 text-[11px]">
        <span>Para probar en tu teléfono real por Wi-Fi: <strong class="text-white font-mono">http://192.168.0.17:8085</strong></span>
        <span>•</span>
        <a href="https://gimnasio-formas-app.vercel.app" target="_blank" class="text-white/80 hover:text-white underline">Ver en Vercel</a>
      </div>
    </div>
  </footer>

  <!-- SCRIPT DE CONTROL Y REACTIVIDAD -->
  <script>
    // Reloj digital en tiempo real de la barra de estado
    function updateClock() {
      const clockEl = document.getElementById('status-clock');
      if (!clockEl) return;
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      clockEl.innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Recargar iframe
    function reloadApp() {
      const frame = document.getElementById('app-frame');
      if (frame) {
        frame.src = 'index.html?t=' + Date.now();
      }
    }

    // Cambiar de rol en 1 clic dentro del simulador
    function setSimulatorRole(role) {
      const frame = document.getElementById('app-frame');
      if (!frame) return;
      try {
        const win = frame.contentWindow;
        if (role === 'alberto') {
          win.sessionStorage.setItem('formas_staff_logged', 'ALBERTO');
          win.localStorage.removeItem('formas_client_mode');
          win.location.reload();
        } else if (role === 'client') {
          win.sessionStorage.removeItem('formas_staff_logged');
          win.localStorage.setItem('formas_client_mode', 'true');
          win.location.reload();
        } else if (role === 'reset') {
          win.sessionStorage.removeItem('formas_staff_logged');
          win.localStorage.removeItem('formas_client_mode');
          win.location.reload();
        }
      } catch(e) {
        frame.src = 'index.html?t=' + Date.now();
      }
    }

    // Configuración de Dispositivos
    const chassis = document.getElementById('phone-chassis');
    const dynamicIsland = document.getElementById('dynamic-island');
    let currentScale = 'auto';

    function setDevice(id, width, height, name) {
      // Reset botones
      ['iphone-16', 'iphone-se', 'pixel-9'].forEach(devId => {
        const btn = document.getElementById('btn-dev-' + devId);
        if (btn) {
          btn.className = (devId === id)
            ? 'px-3 py-1.5 rounded-lg font-medium transition-all bg-white text-black font-semibold shadow'
            : 'px-3 py-1.5 rounded-lg font-medium transition-all text-white/70 hover:text-white';
        }
      });

      // Ancho exterior = ancho pantalla + bordes (22px)
      const outerW = width + 22;
      const outerH = height + 22;
      chassis.style.width = outerW + 'px';
      chassis.style.height = outerH + 'px';

      if (id === 'iphone-se') {
        chassis.style.borderRadius = '40px';
        document.getElementById('phone-screen').style.borderRadius = '32px';
        dynamicIsland.style.display = 'none';
      } else {
        chassis.style.borderRadius = '54px';
        document.getElementById('phone-screen').style.borderRadius = '44px';
        dynamicIsland.style.display = 'flex';
      }

      autoScale();
    }

    // Auto-escalado para que el teléfono encaje perfectamente en cualquier pantalla
    function setScale(scale) {
      currentScale = scale;
      ['auto', 85, 100].forEach(val => {
        const btnId = typeof val === 'string' ? 'btn-scale-auto' : ('btn-scale-' + val);
        const btn = document.getElementById(btnId);
        if (btn) {
          const isActive = (val === 'auto' && scale === 'auto') || (val === 85 && scale === 0.85) || (val === 100 && scale === 1.0);
          btn.className = isActive
            ? 'px-2.5 py-1 rounded-lg transition-all bg-white/20 text-white font-medium'
            : 'px-2 py-1 rounded-lg transition-all text-white/60 hover:text-white';
        }
      });
      autoScale();
    }

    function autoScale() {
      const scaler = document.getElementById('device-scaler');
      const container = document.getElementById('stage-container');
      if (!scaler || !container) return;

      if (currentScale === 'auto') {
        const availableHeight = container.clientHeight - 40;
        const availableWidth = container.clientWidth - 40;
        const phoneHeight = chassis.offsetHeight || 874;
        const phoneWidth = chassis.offsetWidth || 415;

        const scaleY = availableHeight / phoneHeight;
        const scaleX = availableWidth / phoneWidth;
        const fitScale = Math.min(1.0, Math.min(scaleX, scaleY));
        scaler.style.transform = `scale(${fitScale})`;
      } else {
        scaler.style.transform = `scale(${currentScale})`;
      }
    }

    window.addEventListener('resize', autoScale);
    window.addEventListener('DOMContentLoaded', autoScale);
    setTimeout(autoScale, 100);
  </script>
</body>
</html>
